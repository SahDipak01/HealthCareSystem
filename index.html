<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SwasthyaConnect – Unified Digital Health Platform</title>
  <script>
    // Automatically redirect to the active React Multi-Page Application on port 3000
    if (window.location.port !== '3000') {
      window.location.href = 'http://localhost:3000' + window.location.pathname + window.location.hash;
    }
  </script>
  <style>
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      border: 1px solid #334155;
    }
    .btn {
      display: inline-block;
      background: #0d9488;
      color: white;
      padding: 0.85rem 1.75rem;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 style="color: #0d9488; margin-bottom: 0.5rem;">SwasthyaConnect</h1>
    <p>Launching Unified Digital Health Platform Multi-Page Application...</p>
    <a href="http://localhost:3000/" class="btn">Open SwasthyaConnect Application (Port 3000)</a>
  </div>
</body>
</html>
